<style class="bodyimg"></style>
<div class="home-content">
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="player-avatar-wrapper">
                <div class="player-head"></div>
                <div class="player-tooltip">
                    <div class="player-tooltip-role"></div>
                    <div class="player-monnaie"></div>
                </div>
            </div>
            <div class="player-role"></div>
        </div>
        <div class="sidebar-middle">
            <button class="sidebar-social-btn" id="social-web-btn" title="Website" aria-label="Website">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.9 9h-3.07a15.5 15.5 0 0 0-1.2-5.02A8.02 8.02 0 0 1 19.9 11ZM12 4.04c.84 1.2 1.7 3.3 2.08 5.96H9.92C10.3 7.34 11.16 5.24 12 4.04ZM4.1 13h3.07c.13 1.8.55 3.53 1.2 5.02A8.02 8.02 0 0 1 4.1 13Zm3.07-2H4.1a8.02 8.02 0 0 1 4.27-5.02A15.5 15.5 0 0 0 7.17 11Zm1.99 0h5.68A13.4 13.4 0 0 1 14.6 13H9.4a13.4 13.4 0 0 1-.24-2Zm.24 3h5.2c-.38 2.66-1.24 4.76-2.08 5.96-.84-1.2-1.7-3.3-2.08-5.96Zm6.23 4.02c.65-1.5 1.07-3.22 1.2-5.02h3.07a8.02 8.02 0 0 1-4.27 5.02Z"/></svg>
            </button>
            <button class="sidebar-social-btn" id="social-discord-btn" title="Discord" aria-label="Discord">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 5.6A16.8 16.8 0 0 0 16.1 4l-.2.4c2 .5 2.9 1.2 3.6 1.8a13 13 0 0 0-7.5-2.2 13 13 0 0 0-7.5 2.2c.7-.6 1.6-1.3 3.6-1.8L7.9 4a16.8 16.8 0 0 0-4.2 1.6C1.1 9.5.4 13.4.7 17.2a17 17 0 0 0 5.1 2.6l1.1-1.8c-.6-.2-1.2-.5-1.7-.8l.4-.3c3.3 1.6 6.8 1.6 10.9 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.8a17 17 0 0 0 5.1-2.6c.4-4.4-.6-8.3-2.1-11.6ZM9 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
            </button>
            <button class="sidebar-social-btn" id="social-youtube-btn" title="YouTube" aria-label="YouTube">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 7.2a3 3 0 0 0-2.1-2.1C19.5 4.5 12 4.5 12 4.5s-7.5 0-9.4.6A3 3 0 0 0 .5 7.2C0 9.1 0 12 0 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8ZM9.6 15.1V8.9l5.4 3.1-5.4 3.1Z"/></svg>
            </button>
            <button class="sidebar-social-btn" id="social-tiktok-btn" title="TikTok" aria-label="TikTok">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 3c.4 1.5 1.3 2.8 2.7 3.6 1 .6 2.2 1 3.4 1v3.2a10 10 0 0 1-3.2-.5v5.8a6.2 6.2 0 1 1-6.2-6.2c.4 0 .8 0 1.2.1v3.3a2.9 2.9 0 0 0-1.2-.2 2.9 2.9 0 1 0 2.9 2.9V3h3.4Z"/></svg>
            </button>
        </div>
        <div class="sidebar-bottom">
            <button class="settings-btn icon-settings" id="settings-btn"></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="play-element">
            <button class="play-btn" id="play-btn"></button>
            <div class="download-content">
                <div class="text-download" id="text-download"></div>
                <progress value="0" max="0" class="progress-bar"></progress>
            </div>
        </div>

        <section class="news-section">
            <div class="news-list"></div>
        </section>

        <aside class="info-section">
            <div class="info-item">
                <div class="server">
                    <img class="server-img" />
                    <div class="server-text">
                        <div class="name" id="server-name"></div>
                        <div class="desc" id="server-desc"></div>
                    </div>
                    <div class="etat-text">
                        <div class="text" id="players-connected"></div>
                        <div class="online off"></div>
                    </div>
                </div>
            </div>
            <div class="info-item ytb-container">
                <div class="ytb">
                    <div class="ytb-header">
                        <div class="header-text">
                            <div class="title-change" id="video-title"></div>
                        </div>
                    </div>
                    <div class="video">
                        <div class="youtube-thumbnail">
                            <img class="thumbnail-img" alt="YouTube Thumbnail" />
                            <button class="ytb-play-btn" id="play-video-btn"></button>
                        </div>
                        <div class="video-credits"></div>
                        <div class="icon-ytb ytb-btn" id="view-video-btn"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- <div class="advert-banner" id="advert-banner" style="display:none;"></div> -->
    </main>
</div>
