<style class="bodyimg"></style>
<div class="home-content">
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="player-avatar-wrapper">
                <div class="player-head"></div>
                <div class="player-tooltip">
                    <div class="player-tooltip-role"></div>
                    <div class="player-monnaie"></div>
                </div>
            </div>
            <div class="player-role"></div>
        </div>
        <div class="sidebar-middle">
            <button class="sidebar-social-btn" id="social-web-btn" title="Website" aria-label="Website">
                <i class="bi bi-globe2" aria-hidden="true"></i>
            </button>
            <button class="sidebar-social-btn" id="social-discord-btn" title="Discord" aria-label="Discord">
                <i class="bi bi-discord" aria-hidden="true"></i>
            </button>
            <button class="sidebar-social-btn" id="social-youtube-btn" title="YouTube" aria-label="YouTube">
                <i class="bi bi-youtube" aria-hidden="true"></i>
            </button>
            <button class="sidebar-social-btn" id="social-tiktok-btn" title="TikTok" aria-label="TikTok">
                <i class="bi bi-tiktok" aria-hidden="true"></i>
            </button>
        </div>
        <div class="sidebar-bottom">
            <button class="settings-btn icon-settings" id="settings-btn"></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="welcome-block">
            <p class="welcome-subtitle">BIENVENUE SUR</p>
            <h1 class="welcome-title">
                <span class="welcome-demon">DEMON</span><span class="welcome-ray">RAY</span>
            </h1>
            <p class="welcome-tagline">⚔️ Respire. Combat. Deviens une légende. 🌙</p>
        </div>
        <div class="play-element">
            <!-- <button class="play-btn" id="play-btn">PLAY</button> -->
             <button class="play-btn" id="play-btn">
                <span class="play-icon"></span>
                <span class="play-text">JOUER</span>
            </button>
            <div class="download-content">
                <div class="text-download" id="text-download"></div>
                <progress value="0" max="0" class="progress-bar"></progress>
            </div>
        </div>

        <div class="features-container">
            <div class="feature-card" id="feature-news" style="--feature-bg: url('../../images/logo/rengoku.png');">
                <div class="feature-left">
                    <div class="feature-icon"><i class="bi bi-newspaper"></i></div>
                    <h3 class="feature-title">ACTUALITÉS</h3>
                    <p class="feature-description">Les dernières infos du serveur</p>
                    <div class="feature-arrow">→</div>
                </div>
            </div>

            <div class="feature-card" id="feature-shop" style="--feature-bg: url('../../images/logo/tomioka.png');">
                <div class="feature-left">
                    <div class="feature-icon"><i class="bi bi-shop"></i></div>
                    <h3 class="feature-title">BOUTIQUE</h3>
                    <p class="feature-description">Accédez à la boutique</p>
                    <div class="feature-arrow">→</div>
                </div>
            </div>

            <div class="feature-card" id="feature-vote" style="--feature-bg: url('../../images/logo/muichiro.png');">
                <div class="feature-left">
                    <div class="feature-icon"><i class="bi bi-hand-thumbs-up-fill"></i></div>
                    <h3 class="feature-title">VOTE</h3>
                    <p class="feature-description">Votez pour le serveur</p>
                    <div class="feature-arrow">→</div>
                </div>
            </div>

            <div class="feature-card" id="feature-wiki" style="--feature-bg: url('../../images/logo/mitsuri.png');">
                <div class="feature-left">
                    <div class="feature-icon"><i class="bi bi-book-fill"></i></div>
                    <h3 class="feature-title">WIKI</h3>
                    <p class="feature-description">Consultez notre wiki</p>
                    <div class="feature-arrow">→</div>
                </div>
            </div>

            <div class="feature-card" id="feature-discord" style="--feature-bg: url('../../images/logo/sanemi.png');">
                <div class="feature-left">
                    <div class="feature-icon"><i class="bi bi-discord"></i></div>
                    <h3 class="feature-title">DISCORD</h3>
                    <p class="feature-description">Rejoignez notre communauté</p>
                    <div class="feature-arrow">→</div>
                </div>
            </div>
        </div>

        <section class="news-section">
            <div class="news-list"></div>
        </section>
        <aside class="info-section">
            <div class="info-item">
                <div class="server">
                    <img class="server-img" />
                    <div class="server-text">
                        <div class="name" id="server-name"></div>
                        <div class="desc" id="server-desc"></div>
                    </div>
                    <div class="etat-text">
                        <div class="text" id="players-connected"></div>
                        <div class="online off"></div>
                    </div>
                </div>
            </div>
            <div class="info-item ytb-container">
                <div class="ytb">
                    <div class="ytb-header">
                        <div class="header-text">
                            <div class="title-change" id="video-title"></div>
                        </div>
                    </div>
                    <div class="video">
                        <div class="youtube-thumbnail">
                            <img class="thumbnail-img" alt="YouTube Thumbnail" />
                            <button class="ytb-play-btn" id="play-video-btn"></button>
                        </div>
                        <div class="video-credits"></div>
                        <div class="icon-ytb ytb-btn" id="view-video-btn"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- <div class="advert-banner" id="advert-banner" style="display:none;"></div> -->
    </main>
</div>
